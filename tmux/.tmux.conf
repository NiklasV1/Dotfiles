# Set prefix to Alt+Space
unbind C-b
set -g prefix M-Space

# True term colors
# set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-256color"
# set -sa terminal-overrides ",xterm-256color:Tc"
# set -g default-terminal "alacritty"
set -sa terminal-overrides ",alacritty*:Tc"
set -sa terminal-overrides ",xterm*:Tc"

# Faster key repetition (instant <Esc>)
set -s escape-time 0

# Focus events
set-option -g focus-events on

# Theme
set -g status-left-length 50
set -g status-justify centre
set -g status-bg "#e1e1e1"
set -g status-fg "#222222"
set -g window-status-current-style "fg=#fcfcfc,bg=#2d3a8c"
set -g message-style "fg=#222222,bg=#e1e1e1"
set -g message-command-style "fg=#222222,bg=#e1e1e1"
set -g mode-style "fg=#222222,bg=#e0e8f9"
set -g window-style "bg=#fcfcfc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Scroll history
set -g history-limit 10000
setw -g mouse on

# Clipboard
set-option -g set-clipboard external
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
set -s copy-command 'xclip -sel clip -i'

# Window switching
bind-key -n M-1 selectw -t 1
bind-key -n M-2 selectw -t 2
bind-key -n M-3 selectw -t 3
bind-key -n M-4 selectw -t 4
bind-key -n M-5 selectw -t 5
bind-key -n M-6 selectw -t 6
bind-key -n M-7 selectw -t 7
bind-key -n M-8 selectw -t 8
bind-key -n M-9 selectw -t 9

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
